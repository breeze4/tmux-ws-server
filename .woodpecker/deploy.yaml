when:
  - event: push
    branch: main

depends_on:
  - check

# BeeBaby Admin is a host project: it builds no image, so the deploy command
# passes the source marker in the image position and waits for check only.
# scripts/stamp-ci.py --no-image stamps no deploy workflow, so this file keeps
# the host deploy command. Only the agent on beebaby runs a deploy workflow,
# so the deploy key never reaches an agent off the host.
labels:
  location: beebaby

steps:
  deploy:
    image: docker@sha256:11e1133c30f3ceb73c6bdc7dfb78b3f9ed8e8e0d1d0400e91c5ec2eb240bf2ff
    environment:
      BEEBABY_DEPLOY_KEY:
        from_secret: beebaby_deploy_key
    commands:
      - apk add --no-cache openssh-client
      - install -m 0700 -d /root/.ssh
      - printf '%s\n' "$BEEBABY_DEPLOY_KEY" > /root/.ssh/id_ed25519
      - chmod 0600 /root/.ssh/id_ed25519
      - ssh -o StrictHostKeyChecking=accept-new -i /root/.ssh/id_ed25519 beeadmin@100.103.192.66 "deploy beebaby-admin breeze4/tmux-ws-server ${CI_COMMIT_SHA} source deploy"
