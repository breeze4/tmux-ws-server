services:
  beebaby-admin:
    image: ${IMAGE_DIGEST:?Set IMAGE_DIGEST to an immutable GHCR digest}
    environment:
      PORT: "8080"
      TMUX_SOCKET: /run/tmux/default
    user: "1000:1000"
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    volumes:
      # Mount the socket directory rather than the socket file. A tmux socket
      # exists only while a tmux server runs, so a file mount makes the
      # container unstartable after a reboot. A directory mount starts either
      # way, and the socket appears inside the container when a server starts.
      - type: bind
        source: ${TMUX_SOCKET_DIR:?Set TMUX_SOCKET_DIR to the host tmux socket directory}
        target: /run/tmux
        read_only: false
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
