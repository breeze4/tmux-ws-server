<div id="app"></div>
<script>
(function () {
  var app = document.getElementById('app');
  var data;
  try {
    data = JSON.parse(document.getElementById('run').textContent);
  } catch (err) {
    var msg = document.createElement('p');
    msg.className = 'parse-error';
    msg.textContent = 'progress.json parse error: ' + err.message;
    app.appendChild(msg);
    return;
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  var steps = data.steps || [];
  var events = data.events || [];
  document.title = 'Run: ' + (data.spec || 'progress');

  function stepId(s, i) {
    return s.id || 'step-' + (i + 1);
  }

  // ── Header ──────────────────────────────────────────────────
  var header = el('header');
  header.id = 'summary';
  header.dataset.status = data.status || 'running';
  header.appendChild(el('p', 'eyebrow', 'Autonomous run' + (data.repo ? ' · ' + data.repo : '')));
  header.appendChild(el('h1', null, data.spec || ''));

  var done = steps.filter(function (s) { return s.status === 'pass'; }).length;
  var sl = el('div', 'statusline');
  sl.appendChild(el('span', 'pill', String(data.status || 'running').toUpperCase()));
  sl.appendChild(el('span', 'times', done + '/' + steps.length + ' steps done'));
  header.appendChild(sl);

  var strip = el('div', 'stepstrip');
  strip.setAttribute('role', 'navigation');
  strip.setAttribute('aria-label', 'Step progress');
  steps.forEach(function (s, i) {
    var seg = el('a', 'seg');
    seg.dataset.status = s.status || 'queued';
    seg.href = '#' + stepId(s, i);
    seg.title = s.plan || s.title || '';
    seg.setAttribute('aria-label',
      'Go to step ' + (i + 1) + ': ' + (s.title || s.plan || '') +
      ' (' + (s.status || 'queued') + ')');
    strip.appendChild(seg);
  });
  header.appendChild(strip);

  var meta = el('dl', 'meta');
  function addMeta(label, node) {
    if (!node) return;
    meta.appendChild(el('dt', null, label));
    meta.appendChild(node);
  }
  if (data.started) addMeta('Started', el('dd', 'times', data.started));
  if (data.updated) addMeta('Last update', el('dd', 'times', data.updated));
  if (data.now) addMeta('Now', el('dd', null, data.now));
  if (data.branch) {
    var dd = el('dd');
    dd.appendChild(el('code', null, data.branch));
    addMeta('Branch', dd);
  }
  header.appendChild(meta);
  app.appendChild(header);

  // ── Section navigation ──────────────────────────────────────
  var nav = el('nav', 'jumpnav');
  nav.setAttribute('aria-label', 'Run sections');
  var navLabel = el('label', 'jumpnav-label', 'Go to');
  navLabel.htmlFor = 'run-jump';
  nav.appendChild(navLabel);
  var navSelect = el('select', 'jumpselect');
  navSelect.id = 'run-jump';
  navSelect.setAttribute('aria-label', 'Go to run section');
  var navLinks = el('div', 'jumpnav-links');
  function addJump(text, id, status, label, detail) {
    var a = el('a', 'jump', text);
    a.href = '#' + id;
    if (status) a.dataset.status = status;
    if (label) a.setAttribute('aria-label', label);
    navLinks.appendChild(a);
    var option = el('option', null,
      text + (status ? ' · ' + status : '') + (detail ? ' — ' + detail : ''));
    option.value = id;
    navSelect.appendChild(option);
    return a;
  }
  addJump('Summary', 'summary');
  steps.forEach(function (s, i) {
    addJump('Step ' + (i + 1), stepId(s, i), s.status || 'queued',
      'Go to step ' + (i + 1) + ': ' + (s.title || s.plan || '') +
      ' (' + (s.status || 'queued') + ')', s.title || s.plan || '');
  });
  if (events.length) addJump('Events', 'events');
  navSelect.addEventListener('change', function () {
    location.hash = navSelect.value;
  });
  nav.appendChild(navSelect);
  nav.appendChild(navLinks);
  app.appendChild(nav);

  // ── Gates ───────────────────────────────────────────────────
  function renderGate(g) {
    var d = el('div', 'gate');
    var h = el('h3', null, (g.name || g.type || 'gate') + ' · ');
    var v = el('span', 'verdict');
    v.dataset.status = g.status || 'running';
    h.appendChild(v);
    d.appendChild(h);

    var attemptMeta = [];
    if (g.attempt) attemptMeta.push('Attempt ' + g.attempt);
    if (g.classification) attemptMeta.push('Class: ' + g.classification);
    if (g.disposition) attemptMeta.push('Disposition: ' + g.disposition);
    if (attemptMeta.length) {
      d.appendChild(el('p', 'recovery-meta', attemptMeta.join(' · ')));
    }
    if (g.recovery) {
      d.appendChild(el('p', 'recovery', 'Recovery: ' + g.recovery));
    }

    if (g.cmd) d.appendChild(el('p', 'cmd', '$ ' + g.cmd));
    if (g.tail) d.appendChild(el('pre', null, g.tail));
    if (g.full) {
      var det = el('details');
      det.appendChild(el('summary', null, 'Full output'));
      det.appendChild(el('pre', null, g.full));
      if (g.status === 'fail') det.open = true;
      d.appendChild(det);
    }

    if (g.criteria && g.criteria.length) {
      var wrap = el('div', 'tablewrap');
      var t = el('table');
      var hr = el('tr');
      ['Criterion', 'Verdict', 'How it was exercised'].forEach(function (x) {
        hr.appendChild(el('th', null, x));
      });
      t.appendChild(hr);
      g.criteria.forEach(function (c) {
        var tr = el('tr');
        tr.appendChild(el('td', null, c.text || ''));
        var td = el('td');
        td.dataset.status = c.status || 'fail';
        tr.appendChild(td);
        tr.appendChild(el('td', null, c.evidence || ''));
        t.appendChild(tr);
      });
      wrap.appendChild(t);
      d.appendChild(wrap);
    }

    (g.shots || []).forEach(function (sh) {
      var f = el('figure');
      var img = el('img');
      img.src = sh.src || '';
      img.alt = sh.alt || '';
      img.loading = 'lazy';
      f.appendChild(img);
      if (sh.caption) f.appendChild(el('figcaption', null, sh.caption));
      d.appendChild(f);
    });

    if (g.transcript) d.appendChild(el('pre', null, g.transcript));
    return d;
  }

  // ── Steps ───────────────────────────────────────────────────
  var main = el('main');
  steps.forEach(function (s, i) {
    var sec = el('section', 'step');
    sec.dataset.status = s.status || 'queued';
    sec.id = stepId(s, i);

    var head = el('header', 'step-head');
    var h2 = el('h2');
    h2.appendChild(el('span', 'stepnum', 'Step ' + (i + 1)));
    h2.appendChild(document.createTextNode(
      (s.plan ? s.plan + ' — ' : '') + (s.title || '')));
    head.appendChild(h2);
    var chip = el('span', 'chip');
    chip.dataset.status = s.status || 'queued';
    head.appendChild(chip);
    if (s.startedAt) {
      head.appendChild(el('span', 'times',
        s.startedAt + ' → ' + (s.finishedAt || '…')));
    }
    sec.appendChild(head);

    if (s.summary || s.commit) {
      var p = el('p', 'summary', s.summary ? s.summary + ' ' : '');
      if (s.commit && s.commit.hash) {
        p.appendChild(document.createTextNode('Commit '));
        p.appendChild(el('code', null, s.commit.hash));
        if (s.commit.diffstat) {
          p.appendChild(document.createTextNode(' · '));
          p.appendChild(el('code', null, s.commit.diffstat));
        }
      }
      sec.appendChild(p);
    }

    (s.gates || []).forEach(function (g) { sec.appendChild(renderGate(g)); });
    main.appendChild(sec);
  });
  app.appendChild(main);

  // ── Event log (newest first in the JSON) ────────────────────
  if (events.length) {
    var sec = el('section', 'log');
    sec.id = 'events';
    sec.appendChild(el('h2', null, 'Event log'));
    var wrap = el('div', 'tablewrap');
    var t = el('table');
    events.forEach(function (e) {
      var tr = el('tr');
      tr.appendChild(el('td', 'logtime', e.t || ''));
      tr.appendChild(el('td', null, e.msg || ''));
      t.appendChild(tr);
    });
    wrap.appendChild(t);
    sec.appendChild(wrap);
    app.appendChild(sec);
  }

  function setCurrentSection(id) {
    navSelect.value = id;
    Array.prototype.forEach.call(navLinks.querySelectorAll('a'), function (a) {
      if (a.getAttribute('href') === '#' + id) {
        a.setAttribute('aria-current', 'location');
      } else {
        a.removeAttribute('aria-current');
      }
    });
  }

  function currentHashSection() {
    var id = location.hash ? decodeURIComponent(location.hash.slice(1)) : 'summary';
    setCurrentSection(document.getElementById(id) ? id : 'summary');
  }
  function scrollToHashSection() {
    if (!location.hash) return;
    var target = document.getElementById(decodeURIComponent(location.hash.slice(1)));
    if (target) target.scrollIntoView({ block: 'start' });
  }
  currentHashSection();
  requestAnimationFrame(scrollToHashSection);
  window.addEventListener('load', scrollToHashSection, { once: true });
  window.addEventListener('hashchange', currentHashSection);

  if ('IntersectionObserver' in window) {
    var sectionNodes = Array.prototype.map.call(
      navLinks.querySelectorAll('a'),
      function (a) { return document.getElementById(a.getAttribute('href').slice(1)); }
    ).filter(Boolean);
    var observer = new IntersectionObserver(function (entries) {
      var visible = entries.filter(function (entry) { return entry.isIntersecting; });
      if (!visible.length) return;
      visible.sort(function (a, b) {
        return Math.abs(a.boundingClientRect.top) - Math.abs(b.boundingClientRect.top);
      });
      setCurrentSection(visible[0].target.id);
    }, { rootMargin: '-72px 0px -70% 0px', threshold: 0 });
    sectionNodes.forEach(function (node) { observer.observe(node); });
  }

  window.setTimeout(function () { location.reload(); }, 30000);
})();
</script>
