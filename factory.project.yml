# Factory deployment contract for BeeBaby Admin.
#
# Converted from `cicd-router.project.yml` with
# `factory deployment convert`, reviewed field by field, and left byte-faithful
# to the source everywhere the two schemas agree. The source file stays in this
# repository unchanged: it is the rollback input, and it is what deploys this
# project until the Factory registry record says otherwise.
#
# Three fields moved rather than carried, and one was dropped:
#
# - `deploy.host: beebaby` moved to Factory's `config/host.yaml`. A project file
#   names no host, so a second deployment host needs no change here.
# - `eligibility.branches` and `eligibility.refs` collapsed into
#   `source.deploy_branches`, because Factory triggers on a GitHub push rather
#   than on a local ref.
# - `identity.repo_path` was dropped. It named a directory on the operator's
#   Mac; Factory fetches the exact SHA from GitHub, which is what
#   `source.github_owner` and `source.github_repository` say.
#
# The GitHub repository is `tmux-ws-server`. The project kept its earlier name
# and the repository did not, so the two differ on purpose.
#
# Who deploys this commit is not decided here. Factory's registry record for
# this project, `config/projects/beebaby-admin.yaml` in the factory repository,
# carries an `authority` switch that reads `cicd_router` or `factory`, and
# Factory refuses to deploy a project whose record says `cicd_router` whatever
# GitHub reports. That is the migration switch, and it is deliberately
# somewhere a repository cannot set for itself.

version: 1

identity:
  id: beebaby-admin
  name: BeeBaby Admin

source:
  github_owner: breeze4
  github_repository: tmux-ws-server
  deploy_branches:
    - main

gates:
  stages:
    # The same script cicd-router runs, at the same path, unchanged. Keeping the
    # command identical is what makes a same-SHA comparison between the two
    # deployers mean anything.
    # This gate runs more on Beebaby than it did on the operator's Mac. The
    # script runs the tmux-backed integration tests only where tmux is
    # installed, and the Mac has none, so cicd-router skipped them on every run
    # while Factory runs them. Both deployers pass; Factory's coverage is
    # strictly larger. The first Factory run is what found that importing the
    # server bound port 8001, the port the live service holds.
    - name: project-gates
      command: bash scripts/cicd-router-gates.sh
      cwd: .
  dependency_path:
    # Resolved against Factory's disposable checkout rather than the Mac working
    # copy, so `node_modules/.bin` keeps meaning what it meant.
    prepend:
      - node_modules/.bin
  # None. Every cache this gate writes — the npm cache and the pnpm store — is
  # already created and handed over by Factory's pinned toolchain environment.
  caches: []

deploy:
  enabled: true
  # Relative to the deployment home, which config/host.yaml names.
  directory: dev/beebaby-admin
  source_subdir: .
  service_unit: beebaby-admin.service
  restart_units:
    - beebaby-admin.service
  env_files: []
  rsync:
    excludes:
      - .git/
      - .local/
      # Installed and built on the deployment host by the bootstrap step below.
      # `rsync --delete` must leave all four alone, or the running service loses
      # its dependencies and its built output between the copy and the restart.
      - node_modules/
      - dist/
      - server/dist/
      - server/public/
  steps:
    # cicd-router called this a remote step because it reached the host over
    # SSH. Factory runs on the deployment host, so it is no longer remote and it
    # is otherwise the same command from the same directory.
    - name: bootstrap
      command: bash deploy/remote-bootstrap.sh
  port: 8001
  web_path: /

smoke:
  attempts: 5
  delay_seconds: 2
  checks:
    - name: api-health
      kind: http
      port: 8001
      path: /api/health
      expected_status: 200

rollback:
  source: last_green_sha
